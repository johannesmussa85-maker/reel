<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CINEMAX ULTRA - TMDB & Direct Player</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #6366f1;
            --bg-dark: #090d16;
            --card-bg: rgba(23, 32, 51, 0.85);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-gold: #fbbf24;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background: radial-gradient(circle at top, #1e1b4b 0%, var(--bg-dark) 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .main-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            max-width: 900px;
            width: 100%;
            padding: 30px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
        }

        .player-container {
            width: 100%;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 25px;
            border: 1px solid #334155;
        }

        video { width: 100%; display: block; max-height: 480px; }

        .movie-title-text { font-size: 1.8rem; font-weight: 800; margin-bottom: 8px; }
        .synopsis-text { color: var(--text-muted); line-height: 1.6; font-size: 0.95rem; margin-top: 10px; }

        .cast-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
        .cast-tag { background: #1e293b; padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; color: #cbd5e1; border: 1px solid #334155; }

        .btn-download-main {
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, #10b981, #059669);
            color: #fff;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 800;
            text-align: center;
            display: block;
            text-decoration: none;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <!-- Direct Video Player -->
        <div class="player-container">
            <video id="mainVideoPlayer" controls poster="">
                <source id="videoSource" src="" type="video/mp4">
                Browser yako haiwezi kucheza video hii.
            </video>
        </div>

        <!-- Taarifa Kutoka TMDB API -->
        <div>
            <h1 class="movie-title-text" id="movieTitle">Loading Movie...</h1>
            <p class="synopsis-text" id="movieOverview">Tafadhali subiri maelezo yanapakiwa...</p>

            <div style="margin-top: 15px;">
                <h4 style="font-size: 0.8rem; text-transform: uppercase; color: #818cf8; margin-bottom: 6px;">Waigizaji (Top Cast)</h4>
                <div class="cast-tags" id="castContainer"></div>
            </div>
        </div>

        <!-- Direct Download Button -->
        <a id="downloadBtn" href="#" download class="btn-download-main">
            <i class="fa-solid fa-download"></i> Download Direct MP4
        </a>
    </div>

    <script>
        const TMDB_API_KEY = "15d1606f54f160e7b3222d57d42100a5"; // TMDB Demo Key
        const movieId = "260513"; // ID ya Venom (2018) kwenye TMDB

        // Function ya API Call
        function api(path, params) {
            const query = new URLSearchParams({ api_key: TMDB_API_KEY, ...params });
            return fetch(`https://api.themoviedb.org/3${path}?${query}`).then(res => res.json());
        }

        // HUU HAPA MSTARI WAKO WA API:
        api("/movie/" + movieId, { append_to_response: "videos,credits,watch/providers" }).then(function(d) {
            // Weka Taarifa za TMDB kwenye UI
            document.getElementById("movieTitle").innerText = d.title || "Venom_HD.mp4");";
            document.getElementById("movieOverview").innerText = d.overview;

            // Weka Waigizaji
            if (d.credits && d.credits.cast) {
                let castHTML = "";
                d.credits.cast.slice(0, 5).forEach(actor => {
                    castHTML += `<span class="cast-tag">${actor.name}</span>`;
                });
                document.getElementById("castContainer").innerHTML = castHTML;
            }

            // Direct Video Link kutoka Supabase Storage yako
            const directVideoUrl = "https://gkegmztnarvjzakkbyuv.supabase.co/storage/v1/object/public/movies/VENOM%20-%20Official%20Trailer%20(HD).mp4";

            // Weka Video kwenye Player na Download Button
            const player = document.getElementById("mainVideoPlayer");
            document.getElementById("videoSource").src = directVideoUrl;
            player.load(); // Reload player

            const downloadBtn = document.getElementById("downloadBtn");
            downloadBtn.href = directVideoUrl;
            downloadBtn.setAttribute("download", `${d.title || 'Movie'}_HD.mp4`);
        });
    </script>
</body>
</html>
